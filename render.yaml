services:
  - type: web
    name: anonymous-secure-chat
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: MESSAGE_ENCRYPTION_KEY
        sync: false
      - key: ADMIN_USERNAME
        value: anand
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: COOKIE_SECURE
        value: "true"
