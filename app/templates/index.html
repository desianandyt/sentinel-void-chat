<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VOID//CHAT</title><link rel="stylesheet" href="/static/app.css"></head><body><main id="landing" class="screen"><div class="grid"></div><section class="hero"><p class="eyebrow">ANONYMOUS REALTIME NETWORK</p><h1>VOID<span>//</span>CHAT</h1><p class="lede">A temporary place to speak freely. No accounts. No profiles. Encrypted storage.</p><form id="join-form"><label>DISPLAY NAME<input id="display_name" maxlength="40" required autocomplete="nickname" placeholder="your handle"></label><label>CHANNEL ID<input id="channel_id" maxlength="64" required placeholder="night-shift"></label><label>CHANNEL PASSWORD <small>(optional)</small><input id="channel_password" type="password" maxlength="128" placeholder="protected channels"></label><button>ENTER CHANNEL <b>↗</b></button><p id="join-error" class="error"></p></form><div class="create-row"><span>Need a room?</span><button id="create-toggle">CREATE EPHEMERAL CHANNEL</button></div><form id="create-form" class="hidden"><label>NEW CHANNEL ID<input id="new_channel_id" required maxlength="64"></label><label>EXPIRES IN<select id="expires_minutes"><option value="10">10 minutes</option><option value="60">1 hour</option><option value="360">6 hours</option><option value="1440">24 hours</option><option value="0">Never</option></select></label><label>PROTECT WITH PASSWORD<input id="new_password" type="password" maxlength="128"></label><button>CREATE & ENTER <b>↗</b></button></form></section><footer><span>NODE STATUS <i></i> ONLINE</span><span>AES-256-GCM // SESSION-BOUND</span></footer></main><main id="chat" class="screen hidden"><header><div><div class="brand">VOID<span>//</span>CHAT</div><div id="room-meta"></div></div><button id="leave">LEAVE CHANNEL</button></header><section id="messages" aria-live="polite"></section><form id="message-form"><input id="message" maxlength="1000" autocomplete="off" placeholder="Transmit a message…"><button aria-label="Send">↗</button></form><div id="chat-status"></div></main><script>window.CSRF={{ csrf|tojson }};</script><script src="https://cdn.socket.io/4.8.1/socket.io.min.js" crossorigin="anonymous"></script><script src="/static/app.js"></script></body></html>
